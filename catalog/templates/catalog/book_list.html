{% extends 'base_generic.html' %}

{% block content %}
    <h1>Book List</h1>

    {% if books  %}
        <ul>
        {% for book in books %}
            <li>
                <a href="{{ book.get_absolute_url }}">{{ book.title }}</a> by {{ book.author }}
                ({{ book.author }})
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No books are available.</p>
    {% endif %}
{% endblock %}
