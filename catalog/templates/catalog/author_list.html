{% extends "base_generic.html" %}

{% block content %}
    <h1>Author List</h1>
    {% if authors %}
      <ul>
          {% for author in authors %}
            <li>
              <p>
                  <strong>Author:</strong>
                  <a href="{{ author.get_absolute_url }}">{{ author.first_name }} {{ author.last_name }}</a>
              </p>
            </li>
          {% endfor %}
     </ul>
    {% else %}
      <p>There are no authors available.</p>
    {% endif %}
{% endblock %}
